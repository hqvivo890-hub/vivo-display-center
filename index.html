<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vivo Display Center (BCT)</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#0d1020; --muted:#5b6275; --line:#dfe3ee; --blue:#415fff; --blue-ink:#ffffff; --icon-bg:#eaeeff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0c0e16; --card:#161a26; --ink:#f2f4fb; --muted:#9aa2b8; --line:#272d3f; --blue:#7b8fff; --blue-ink:#0c0e16; --icon-bg:#222a4a; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#0c0e16; --card:#161a26; --ink:#f2f4fb; --muted:#9aa2b8; --line:#272d3f; --blue:#7b8fff; --blue-ink:#0c0e16; --icon-bg:#222a4a; color-scheme:dark;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",Arial,sans-serif;line-height:1.4}
main{max-width:480px;margin:0 auto;padding:28px 18px 40px}
.brand{margin:0;line-height:0}.brand img{display:block;max-width:150px;height:auto}
.sub{margin:2px 0 22px;font-size:17px;color:var(--muted)}
.links{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.links a{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;min-height:68px}
.links a:active{transform:scale(.985)}
.links a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ico{flex:none;width:44px;height:44px;border-radius:12px;background:var(--icon-bg);display:grid;place-items:center;color:var(--blue)}
.ico svg{width:24px;height:24px}
.t{display:block;font-size:17px;font-weight:650}
.d{display:block;font-size:14px;color:var(--muted)}
.primary{background:var(--blue)!important;border-color:var(--blue)!important;color:var(--blue-ink)!important}
.primary .ico{background:rgba(255,255,255,.22);color:var(--blue-ink)}
.primary .d{color:inherit;opacity:.85}
.chev{margin-left:auto;flex:none;width:18px;height:18px;opacity:.5}
.info{margin-top:22px;padding:16px;border-radius:16px;border:1px dashed var(--line);font-size:15px;color:var(--muted)}
.info b{color:var(--ink)}
</style>
</head>
